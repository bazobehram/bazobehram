name: Update AdShield DNS feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: adshield-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate feed
        run: python3 scripts/update-adshield.py
      - name: Commit only when feed changes
        run: |
          if git diff --quiet -- adshield-rules.txt; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- adshield-rules.txt
          git commit -m "chore(adshield): refresh DNS blocklist"
          git push
